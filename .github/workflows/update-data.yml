# 自动更新数据:美国排期公告 + 联邦公报法规动态 + 加拿大 EE 抽签
# 每小时第 17 分核对一次,避开整点拥堵;所有 cron 时间均为 UTC。
# GitHub 高峰期会推迟甚至丢弃个别定时运行,下一小时会补上。
#
# 每次核对都把精确到秒的核对时刻写进数据并提交,网页据此显示「最近核对」。
# 所以每次成功运行都会触发一次 Vercel 部署,一天至多 24 次;Vercel 免费版的上限是
# 全账号每天 100 次,超出只会暂停部署到次日,不会产生费用。
#
# 抓完不直接提交。抓取脚本失败的方式不止「报错退出」一种 —— 源站改版会让解析器
# 安静地返回空列表,网络中断会让它只拿到一半。所以先过一道数据校验,再用这份数据
# 真的构建一次生产站点,两关都过了才提交。任何一关不过,已有数据保持原样。
name: daily-data-update

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 排队等过的定时运行,事件里记录的提交会落后于 main;每次都提交之后,
      # 拿旧提交去推送会因为不是快进而失败。所以取运行时 main 的最新提交。
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 排期抓取回归测试
        run: python3 -m unittest discover -s scripts/tests -v

      - name: 抓取美国排期公告(增量)
        run: python3 scripts/scrape_bulletins.py

      - name: 实测从官网自动补回缺失的最新一期
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/verify_bulletin_refresh.py

      - name: 抓取联邦公报法规动态
        run: python3 scripts/fetch_news.py

      # GitHub 托管 runner 预装 Chrome;IRCC 的 Akamai 防护可能拦截
      # 数据中心 IP,失败时不阻塞其余数据更新
      - name: 抓取加拿大 EE 抽签数据
        run: python3 scripts/fetch_canada.py || echo "::warning::加拿大源抓取失败(可能为 IP 拦截),保留现有数据"

      # 结构、日期、非空,以及跟上一版比条数有没有倒退。
      - name: 校验抓到的数据
        run: node scripts/validate_data.mjs

      # 数据能过校验,不等于站点构建得出来。这一步用新数据真跑一次生产构建。
      - name: 用新数据构建生产站点
        run: npm run build

      - name: 提交数据变更
        run: |
          git config user.name "greenlane-bot"
          git config user.email "greenlane-bot@users.noreply.github.com"
          git add src/data
          if git diff --cached --quiet; then
            echo "数据无变化,跳过提交"
          else
            git commit -m "chore: 数据核对 $(date -u '+%F %H:%M') UTC"
            # 运行期间如果有人推送了代码,先变基到最新再推
            git pull --rebase origin main
            git push
          fi
