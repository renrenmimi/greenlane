# 自动更新数据:联邦公报法规动态 + 加拿大 EE 抽签
# 每小时第 17 分核对一次,避开整点拥堵;所有 cron 时间均为 UTC。
# GitHub 高峰期会推迟甚至丢弃个别定时运行,下一小时会补上。
#
# 美国排期公告不在这里抓:2026 年 11 月起国务院的两个官方入口对脚本访问一律 403
# (Cloudflare 封禁)。改为每月手动导入一次(scrape_bulletins.py --import),
# 到期提醒见 bulletin-reminder 工作流。
#
# 只有数据内容真的变了才提交。抓取脚本每次都会把 updatedAt 刷成当前时刻(精确到秒、
# UTC),只是刷新了时间的文件在提交前还原,所以 Vercel 只在有新数据时才部署,
# 网页上的「数据更新于」就是最近一次抓到新数据的时间。
#
# 抓完不直接提交。抓取脚本失败的方式不止「报错退出」一种 —— 源站改版会让解析器
# 安静地返回空列表,网络中断会让它只拿到一半。所以先过一道数据校验,再用这份数据
# 真的构建一次生产站点,两关都过了才提交。任何一关不过,已有数据保持原样。
name: daily-data-update

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 排队等过的定时运行,事件里记录的提交会落后于 main;每次都提交之后,
      # 拿旧提交去推送会因为不是快进而失败。所以取运行时 main 的最新提交。
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 手动导入走的也是同一套解析和校验,所以测试照跑
      - name: 排期解析回归测试
        run: python3 -m unittest discover -s scripts/tests -v

      - name: 抓取联邦公报法规动态
        run: python3 scripts/fetch_news.py

      # GitHub 托管 runner 预装 Chrome;IRCC 的 Akamai 防护可能拦截
      # 数据中心 IP,失败时不阻塞其余数据更新
      - name: 抓取加拿大 EE 抽签数据
        run: python3 scripts/fetch_canada.py || echo "::warning::加拿大源抓取失败(可能为 IP 拦截),保留现有数据"

      # 结构、日期、非空,以及跟上一版比条数有没有倒退。
      - name: 校验抓到的数据
        run: node scripts/validate_data.mjs

      # 数据能过校验,不等于站点构建得出来。这一步用新数据真跑一次生产构建。
      # 构建时要从 Google Fonts 下载上百个中文字体分片,偶尔会有一个下载失败,失败就重试一次。
      - name: 用新数据构建生产站点
        run: npm run build || { echo "::warning::首次构建失败(多半是 Google 字体下载抖动),重试一次"; npm run build; }

      # 只刷新了 updatedAt、数据本身没变的文件还原成上一版:不提交,也就不触发部署。
      - name: 只保留真正有变化的数据
        run: node scripts/keep_changed_only.mjs

      - name: 提交数据变更
        run: |
          git config user.name "greenlane-bot"
          git config user.email "greenlane-bot@users.noreply.github.com"
          git add src/data
          if git diff --cached --quiet; then
            echo "数据无变化,跳过提交"
          else
            CHANGED=$(git diff --cached --name-only | xargs -n1 basename | sed 's/\.json$//' | paste -sd, -)
            git commit -m "chore: 数据更新 ${CHANGED} · $(date -u '+%F %H:%M') UTC"
            # 运行期间如果有人推送了代码,先变基到最新再推
            git pull --rebase origin main
            git push
          fi
